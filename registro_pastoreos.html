<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro de Pastoreos · Puntal Agro</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="pa-core.js"></script>
<style>
/* Layout: header + barra de secciones (estilo Puntal) + una card de trabajo por sección */
:root{
  --bg:#F0F2F5;--card:#fff;--border:#E4E8EE;--text:#0F1923;--muted:#7A8899;--sub:#475569;
  --bar:#E8EDF2;--ctl:#CBD5E1;--row:#F5F7FA;--hover:#FAFBFC;
  --verde:#4A6533;--verde-t:#fff;--naranja:#C8642D;--edit:#E8F5E9;--edit-f:#DCFCE7;
  --ok-t:#3B6D11;--ok-b:#F0FDF4;--warn-t:#92400E;--warn-b:#FFFBEB;--bad-t:#A84D1F;--bad-b:#FEF2F2;
  --radius:12px;--sans:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12171C;--card:#1A2128;--border:#2A333D;--text:#E6EBF0;--muted:#8D9AAA;--sub:#AAB6C3;
  --bar:#1F2730;--ctl:#3A4552;--row:#202931;--hover:#1E262E;
  --verde:#6E8F4E;--verde-t:#fff;--naranja:#D97A45;--edit:#22331F;--edit-f:#2A4126;
  --ok-t:#9BC77A;--ok-b:#1F2E1C;--warn-t:#E3B66A;--warn-b:#33291A;--bad-t:#E89273;--bad-b:#3A231C;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171C;--card:#1A2128;--border:#2A333D;--text:#E6EBF0;--muted:#8D9AAA;--sub:#AAB6C3;
  --bar:#1F2730;--ctl:#3A4552;--row:#202931;--hover:#1E262E;
  --verde:#6E8F4E;--verde-t:#fff;--naranja:#D97A45;--edit:#22331F;--edit-f:#2A4126;
  --ok-t:#9BC77A;--ok-b:#1F2E1C;--warn-t:#E3B66A;--warn-b:#33291A;--bad-t:#E89273;--bad-b:#3A231C;color-scheme:dark}
*{box-sizing:border-box}
body{font-family:var(--sans);background:var(--bg);color:var(--text);font-size:14px;margin:0}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{background:var(--card);border-bottom:1px solid var(--border);padding-block:10px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px}
.logo img{height:40px;width:auto;background:#fff;border-radius:6px;padding:2px 4px}
.logo-title{font-size:13px;font-weight:600;letter-spacing:-.2px}
.logo-sub{font-size:11px;color:var(--muted)}
.hsel{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;font-weight:500;display:flex;align-items:center;gap:6px}
.hsel select{text-transform:none;letter-spacing:0;font-size:12px}
.hright{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.role{font-size:11px;color:var(--muted);background:var(--bg);padding:3px 10px;border-radius:20px;border:1px solid var(--border);white-space:nowrap}
.inst-bar{background:var(--bar);border-bottom:1px solid var(--border);padding-block:8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.inst-lbl{font-size:10px;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;font-weight:500;margin-right:4px}
.inst-btn{padding:5px 14px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;border:1.5px solid var(--ctl);background:var(--card);color:var(--sub);font-family:var(--sans)}
.inst-btn.active{background:var(--verde);color:var(--verde-t);border-color:var(--verde)}
.inst-btn .n{font-variant-numeric:tabular-nums;opacity:.7;margin-left:4px}
main{padding-block:16px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);padding:12px 14px;min-width:0}
.chd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px;flex-wrap:wrap}
.ct{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.btn{font-family:var(--sans);font-size:12px;font-weight:500;padding:5px 12px;border-radius:6px;border:1px solid var(--ctl);background:var(--card);color:var(--sub);cursor:pointer}
.btn.pri{background:var(--verde);border-color:var(--verde);color:var(--verde-t)}
.btn.warn{color:var(--bad-t);border-color:var(--bad-t);background:var(--card)}
.btn:disabled{opacity:.45;cursor:default}
.btn.hmenu{text-decoration:none;display:inline-flex;align-items:center}
.btn.hmenu:hover{border-color:var(--verde);color:var(--verde)}
.btn:focus-visible,.inst-btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--verde);outline-offset:1px}
input,select,textarea{font-family:var(--sans);font-size:12px;color:var(--text);background:var(--card);border:1px solid var(--ctl);border-radius:6px;padding:5px 8px}
input[type=search]{min-width:180px}
td select{padding:2px 6px;font-size:12px}
.tw{overflow-x:auto}
.scroll-y{max-height:560px;overflow-y:auto}
thead th{vertical-align:bottom}
.tools label.fr{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.tools label.fr input{font:inherit;font-size:13px;padding:4px 6px;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--text)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:baseline}
.lgd{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px;font-size:11px;color:var(--muted)}
.leg{white-space:nowrap}
.seg{display:inline-flex;gap:0}.seg .btn{border-radius:0}.seg .btn:first-child{border-radius:6px 0 0 6px}.seg .btn:last-child{border-radius:0 6px 6px 0;margin-left:-1px}
.tools label.fr select{font:inherit;font-size:13px;padding:4px 6px;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--text)}
.tl{min-width:760px}.tl-row{display:flex;align-items:center;border-bottom:1px solid var(--border);min-height:24px}
.tl-n{width:150px;flex:none;font-size:12px;font-weight:500;padding:3px 8px 3px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-t{flex:1;position:relative;height:16px;background:#ECEFF2;border-radius:3px}
.tl-k{width:82px;flex:none;text-align:right;font-size:12px;font-variant-numeric:tabular-nums;padding-left:6px}
.tl-head{border-bottom:1px solid var(--border);min-height:30px}.tl-head .tl-n,.tl-head .tl-k{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;font-weight:600;white-space:normal;line-height:1.2}
.tl-head .tl-t{background:none;height:20px}.tl-m{position:absolute;top:2px;font-size:10px;color:var(--muted);border-left:1px solid var(--border);padding-left:2px;white-space:nowrap}
.tl-b{position:absolute;top:0;bottom:0;border-radius:2px;cursor:pointer;opacity:.9}.tl-b:hover{opacity:1;outline:1px solid var(--text)}
.tl-ab{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.35) 0 3px,transparent 3px 6px)!important}
.defmov{grid-column:1/-1;font-size:12px;color:var(--text);background:#EEF2E8;border-left:3px solid var(--verde);border-radius:4px;padding:6px 10px;line-height:1.45}
select.fcol{margin-top:4px;width:100%;min-width:90px;font:inherit;font-size:12px;text-transform:none;letter-spacing:0;color:var(--text);padding:3px 4px;border:1px solid var(--border);border-radius:6px;background:var(--card)}
table{width:100%;border-collapse:collapse}
thead th{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;font-weight:500;padding:5px 6px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap;background:var(--card);position:sticky;top:0;z-index:1}
thead th.r,td.r{text-align:right}
tbody td{padding:7px 6px;border-bottom:1px solid var(--row);font-size:12px;vertical-align:middle;font-variant-numeric:tabular-nums}
tbody tr.click{cursor:pointer}
tbody tr:hover td{background:var(--hover)}
tbody tr.sel td{background:var(--edit)}
tr.off td{color:var(--muted)}
.tdname{font-weight:500}
.tr-ref td{background:var(--row)!important;font-weight:600}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
.bdg{display:inline-block;padding:1px 7px;border-radius:10px;font-size:10px;font-weight:600;white-space:nowrap}
.bg{background:var(--ok-b);color:var(--ok-t)}.by{background:var(--warn-b);color:var(--warn-t)}.br{background:var(--bad-b);color:var(--bad-t)}.bn{background:var(--row);color:var(--muted)}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;padding:12px;background:var(--row);border-radius:8px;margin-bottom:12px}
.form.form-c{grid-template-columns:repeat(auto-fill,minmax(125px,1fr))}
.form label{display:flex;flex-direction:column;justify-content:flex-end;gap:4px;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;font-weight:500}
.form label.wide{grid-column:1/-1}
.form .ed{background:var(--edit);border-color:transparent}
.form .ed:focus{background:var(--edit-f)}
.form-actions{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.msg{font-size:12px;color:var(--muted)}
.msg.err{color:var(--bad-t)}
.pnote{font-size:11px;color:var(--muted);margin-top:8px;padding:6px 10px;background:var(--bg);border-radius:6px;line-height:1.5}
.metrics{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.mc{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);border-left:3px solid var(--naranja);padding:10px 14px}
.mc-lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;font-weight:600;margin-bottom:4px}
.mc-val{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.mc-unit{font-size:11px;color:var(--muted);font-weight:400;margin-left:3px}
.swatches{display:flex;gap:4px;flex-wrap:wrap}
.sw{width:20px;height:20px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
.sw.on{border-color:var(--text)}
.empty{padding:28px 12px;text-align:center;color:var(--muted);font-size:13px;line-height:1.6}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
footer{border-top:1px solid var(--border);background:var(--card);font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding-block:10px;font-variant-numeric:tabular-nums}
@media(max-width:768px){.g2{grid-template-columns:1fr}input[type=search]{min-width:0;width:100%}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

   BUILD 59: categorías de hacienda generales del sistema; solo Puntal (admin_general) las crea o modifica.

var TOOL_ID='registro_pastoreos'; /* id de la herramienta en pa-core (HERRAMIENTAS_PROPIAS) */
/* Permiso por herramienta. Si pa-core todavía no tiene dado de alta TOOL_ID, se chequea solo el
   nivel (fail-open, mismo criterio que el index) para no dejar a nadie afuera. Ver handoff Mariana. */
function toolRegistrada(){try{if(typeof PA.demo.herramientasPropias!=='function')return false;var hs=PA.demo.herramientasPropias();for(var i=0;i<hs.length;i++)if(hs[i].id===TOOL_ID)return true;}catch(e){}return false;}
/* Categorías de hacienda: catálogo GENERAL del sistema (igual para todas las empresas).
   Solo el equipo Puntal (admin_general) las crea o modifica. Si vienen de pa-core, acá son solo lectura. */
function esPuntal(){return !!(CTX&&CTX.usuario&&CTX.usuario.rol==='admin_general');}
function catEditable(){return !CATS_PA&&esPuntal();}
function puede(nivel){return toolRegistrada()?PA.can(nivel,{herramienta:TOOL_ID}):PA.can(nivel);}
function f(v,d){ d=d||0; if(v==null||isNaN(Number(v))) return '—';
  return Number(v).toLocaleString('es-AR',{minimumFractionDigits:d,maximumFractionDigits:d});
}
function fp(v){ if(v==null||isNaN(Number(v))) return '—'; return Number(v).toFixed(1)+'%'; }
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function parseAR(s){if(s==null)return null;s=String(s).replace(/\s/g,'');if(s==='')return null;s=s.replace(/\./g,'').replace(',','.');var v=parseFloat(s);return isNaN(v)?null:v;}

// ===== MOTOR DE CÁLCULO (ES5) =====
var COEF_DEF={a:0.3352,b:0.00107038,c:0.1054,d:0.00099244,kgEV:10};

function pd(s){if(!s||!/^\d{4}-\d{2}-\d{2}$/.test(s))return null;var p=s.split('-');return Date.UTC(+p[0],+p[1]-1,+p[2]);}
function ds(t){var d=new Date(t);var m=d.getUTCMonth()+1,dd=d.getUTCDate();return d.getUTCFullYear()+'-'+(m<10?'0':'')+m+'-'+(dd<10?'0':'')+dd;}
function ym(t){return ds(t).substr(0,7);}
function normRec(r){return r==='Pastura agropiro'?'Pasturas agropiro':r;}
function evCab(x,ad){return COEF.a+COEF.b*x+COEF.c*ad+COEF.d*x*ad;}

// Construye la lista de pastoreos con su base física (no depende de coeficientes)
function buildPastoreos(DATA){
  var out=[],alerts=[],i,j,k;
  var names={},supKey={},sinHoja={},shOrd=[];
  for(i=0;i<DATA.pots.length;i++){var nm=DATA.pots[i].n;names[nm]=(names[nm]||0)+1;}
  for(nm in names){if(names[nm]>1)alerts.push({nv:'aviso',h:'—',n:nm,p:'—',t:'Lote repetido en '+names[nm]+' hojas: el suplemento se descuenta en ambas, como en el Excel'});}
  for(i=0;i<DATA.supl.length;i++){var s=DATA.supl[i];var key=s[1]+'|'+s[2];
    if(!names[s[1]]){if(!sinHoja[s[1]]){sinHoja[s[1]]={c:0,kg:0};shOrd.push(s[1]);}sinHoja[s[1]].c++;sinHoja[s[1]].kg+=(s[5]||0);continue;}
    supKey[key]=(supKey[key]||0)+(s[5]||0);}
  for(i=0;i<shOrd.length;i++){var sh=sinHoja[shOrd[i]];alerts.push({nv:'aviso',h:'Suplementación',n:shOrd[i],p:'—',t:sh.c+' entregas ('+f(sh.kg)+' kg MS) cargadas a un lote que no tiene hoja: no se descuentan'});}
  for(i=0;i<DATA.pots.length;i++){
    var P=DATA.pots[i];
    if(!P.ha)alerts.push({nv:'aviso',h:P.h,n:P.n,p:'—',t:'Lote sin superficie en el sistema: kg MS/ha queda vacío'});
    var groups={},order=[];
    for(j=0;j<P.mv.length;j++){var m=P.mv[j];var id=m[1];if(id==null||id===''){alerts.push({nv:'error',h:P.h,n:P.n,p:'—',t:'Movimiento sin # de pastoreo ('+m[3]+')'});continue;}
      if(!groups[id]){groups[id]=[];order.push(id);}groups[id].push(m);}
    for(k=0;k<order.length;k++){
      var id2=order[k],mv=groups[id2],err=[];
      var ini=null,fin=null,rows=[];
      for(j=0;j<mv.length;j++){var r=mv[j];var t=pd(r[0]);
        if(t===null||t<Date.UTC(2015,0,1)){err.push('Fecha inválida ('+r[0]+', '+r[3]+')');continue;}
        var mov=(r[3]||'').toLowerCase();
        if(mov==='inicio pastoreo'){if(ini===null||t<ini)ini=t;}
        if(mov==='fin pastoreo'){if(fin===null||t>fin)fin=t;}
        if(r[6]==null&&r[4]!=='M')err.push('Sin pesada ('+r[2]+', '+r[3]+')');
        rows.push({t:t,mov:mov,esm:r[4],cab:+r[5]||0,kg:(+r[5]||0)*(r[6]||0)});}
      if(ini===null)err.push('Sin Inicio Pastoreo');
      if(ini!==null&&fin!==null&&fin<ini)err.push('Fin ('+ds(fin)+') anterior al inicio ('+ds(ini)+')');
      var abierto=(fin===null);
      if(!err.length&&!abierto){for(j=0;j<rows.length;j++){if(rows[j].t<ini||rows[j].t>fin){err.push('Movimiento del '+ds(rows[j].t)+' fuera del período '+ds(ini)+' → '+ds(fin)+' (¿# de pastoreo repetido?)');break;}}}
      rows.sort(function(a,b){return a.t-b.t;});
      if(!err.length){var stk=0,z=null;for(j=0;j<rows.length;j++){var q=rows[j];
        if(z!==null&&q.mov==='inicio pastoreo'){err.push('# de pastoreo repetido: el lote queda vacío el '+ds(z)+' y vuelve a entrar hacienda el '+ds(q.t));break;}
        stk+=q.esm==='E'?q.cab:-q.cab;
        if((j+1===rows.length||rows[j+1].t!==q.t)&&stk<=0&&j+1<rows.length)z=q.t;}}
      var o={h:P.h,n:P.n,ha:P.ha||0,r:normRec((P.rp&&P.rp[id2])||P.r),gid:(P.gid&&P.gid[id2])||null,p:id2,ini:ini,fin:fin,abierto:abierto,err:err,supl:supKey[P.n+'|'+id2]||0,cabIn:0};
      if(!err.length&&!abierto){
        var T=(fin-ini)/DAY,cab=0,ekg=0,skg=0,iv=[],cd=0,Ekg=0,Skg=0,cabIn=0;
        for(j=0;j<rows.length;j++){var rw=rows[j];
          if(rw.esm==='E'){Ekg+=rw.kg;cabIn+=rw.cab;}else if(rw.esm==='S'){Skg+=rw.kg;}}
        for(j=0;j<rows.length;j++){var rw2=rows[j];
          if(rw2.esm==='E'){cab+=rw2.cab;ekg+=rw2.kg;}else if(rw2.esm==='S'){cab-=rw2.cab;skg+=rw2.kg;}else if(rw2.esm==='M'){cab-=rw2.cab;}
          var tn=(j+1<rows.length)?rows[j+1].t:rw2.t;var d=(tn-rw2.t)/DAY;
          if(d>0)iv.push({t0:rw2.t,d:d,cab:cab,kg:Math.max(0,ekg-skg)});}
        for(j=0;j<iv.length;j++)cd+=iv[j].d*iv[j].cab;
        o.T=T;o.cabIn=cabIn;o.cabFin=cab;o.iv=iv;o.cd=cd;
        o.V=T>0?cd/T:0;
        o.AE=Skg-Ekg;
        if(cab!==0)alerts.push({nv:'aviso',h:P.h,n:P.n,p:id2,t:'El balance de cabezas no cierra al fin del pastoreo (quedan '+cab+')'});
        if(T===0)err.push('Inicio y fin el mismo día');
      }
      for(j=0;j<err.length;j++)alerts.push({nv:'error',h:P.h,n:P.n,p:id2,t:err[j]});
      out.push(o);
    }
  }
  return {list:out,alerts:alerts};
}
// Aplica coeficientes (se vuelve a correr al editar)
function calcPastoreos(list){
  for(var i=0;i<list.length;i++){var o=list[i];
    o.ms=null;o.past=null;o.ev=null;o.X=null;o.AD=null;o.msha=null;o.adFuera=false;
    if(o.err.length||o.abierto||!o.T)continue;
    var AD=(o.V>0)?o.AE/o.T/o.V:0,bb=0,j;
    for(j=0;j<o.iv.length;j++){var v=o.iv[j];bb+=v.d*(v.kg+v.d*AD*v.cab);}
    var W=bb/o.T,X=o.V>0?W/o.V:0;
    o.AD=AD;o.X=X;
    if(AD<ADPV_MIN||AD>ADPV_MAX){o.adFuera=true;continue;}
    o.ev=evCab(X,AD);
    o.ms=o.ev*o.cd*COEF.kgEV;
    o.past=o.ms-o.supl;
    o.msha=o.ha?o.past/o.ha:null;
  }
}
// Reparte la MS de pasto por mes según cabezas·día de cada tramo
function monthly(o){var res={},j,t;if(o.past==null||!o.cd)return res;
  for(j=0;j<o.iv.length;j++){var v=o.iv[j];if(!v.cab)continue;
    for(t=v.t0;t<v.t0+v.d*DAY;t+=DAY){var k=ym(t);res[k]=(res[k]||0)+v.cab/o.cd*o.past;}}
  return res;}

function removeWhere(key,match){var all=lsGet(key,[]),out=[];for(var i=0;i<all.length;i++)if(!match(all[i]))out.push(all[i]);var ok=lsSet(key,out);cargarPropios();return ok;}

function pctOf(s){return typeof s.pctMS==='number'?s.pctMS:(typeof s.humedad==='number'?(1-s.humedad)*100:null);}

var CALC=null,BYG={};
function calc(){if(CALC)return CALC;BYG={};
  var k;for(k in S.cfg.coef){COEF[k]=S.cfg.coef[k];COEF_DEF[k]=S.cfg.coef[k];}
  ADPV_MIN=S.cfg.adpvMin;ADPV_MAX=S.cfg.adpvMax;
  var pots={},supl=[],i,j,g,p,gs=vals(S.pastoreos);
  for(i=0;i<gs.length;i++){g=gs[i];var gk=gKey(g);p={nombre:gName(g),ha:gHa(g)};
    if(!pots[gk])pots[gk]={h:p.nombre,n:p.nombre,ha:p.ha||0,r:rName(g.tipoActividadId),rp:{},gid:{},mv:[]};
    var P=pots[gk];P.rp[g.num]=rName(g.tipoActividadId);P.gid[g.num]=g.id;
    for(j=0;j<(g.movs||[]).length;j++){var m=g.movs[j],t=TIPOS[m.tipo]||{n:m.tipo,s:''},c=S.categorias[m.categoriaId];
      P.mv.push([m.fecha,g.num,c?c.nombre:'?',m.cierra?'Fin pastoreo':t.n,t.s,m.cab,m.kg]);}
    for(j=0;j<(g.supl||[]).length;j++){var s=g.supl[j];
      supl.push([s.fecha,p.nombre,g.num,suplName(s),s.kgTC,kgMsOf(s)]);}}
  var R=buildPastoreos({pots:vals(pots),supl:supl});calcPastoreos(R.list);
  for(i=0;i<gs.length;i++)if(!gs[i].tipoActividadId){R.alerts.push({nv:'aviso',h:gName(gs[i]),n:gName(gs[i]),p:gs[i].num,t:'Sin recurso: el lote no tiene actividad en el Plan de Uso para la campaña '+campName(gs[i].campaniaId)+'. Cuando esté cargada, usá “Cambiar recurso”.'});}
  for(i=0;i<R.list.length;i++){var o=R.list[i];if(o.adFuera)R.alerts.push({nv:'error',h:o.h,n:o.n,p:o.p,t:'ADPV fuera de rango ('+f(o.AD,2)+' kg/día): revisá las pesadas'});}
  var lk={};for(i=0;i<R.list.length;i++){lk[R.list[i].n+'|'+R.list[i].p]=R.list[i].gid;BYG[R.list[i].gid]=R.list[i];}
  for(i=0;i<R.alerts.length;i++)R.alerts[i].gid=lk[R.alerts[i].n+'|'+R.alerts[i].p]||null;
  CALC=R;return R;}

  t=String(t).replace(/\s+/g,' ').replace(/^\s|\s$/g,'').replace(/^[\u25BE\u25B8\u25BC\u25BA]\s*/,'');if(t==='—')return '';

  if(num){var pc=t.charAt(t.length-1)==='%',v=parseAR(pc?t.slice(0,-1):t);if(v!==null)return pc?v/100:v;}
  return t;}

  return t.replace(/\s+/g,' ').replace(/^\s|\s$/g,'');}

    var ws=XLSX.utils.aoa_to_sheet(aoa),cols=[];for(j=0;j<aoa.length;j++)for(k=0;k<aoa[j].length;k++){var L=String(aoa[j][k]).length;if(!cols[k]||cols[k].wch<L)cols[k]={wch:Math.min(Math.max(L,8),45)};}

function racPct(comp){if(!comp||!comp.length)return null;var t=0,s=0;
  for(var i=0;i<comp.length;i++){var pm=S.insMs[comp[i].insumoId];if(typeof pm!=='number')return null;t+=comp[i].pctIncl;s+=comp[i].pctIncl*pm;}

function racConIng(insId){var rs=vals(S.raciones);for(var i=0;i<rs.length;i++)for(var j=0;j<(rs[i].componentes||[]).length;j++)if(rs[i].componentes[j].insumoId===insId)return rs[i].nombre;return '';}

function guardarRac(){if(!CAN||!RAC)return;var R=RAC,i,nom=(R.nombre||'').replace(/^\s+|\s+$/g,'');if(!nom)return racErr('Escribí un nombre.');
  var xs=vals(S.raciones);for(i=0;i<xs.length;i++)if(xs[i].id!==R.id&&(xs[i].nombre||'').toLowerCase()===nom.toLowerCase())return racErr('Ya existe una ración “'+nom+'”.');
  var comp=[],us={},t=0;
  for(i=0;i<R.filas.length;i++){var fl=R.filas[i];if(!fl.ing&&!fl.pct)continue;if(!fl.ing)return racErr('Fila '+(i+1)+': elegí el ingrediente.');
    var nm=S.insumos[fl.ing]?S.insumos[fl.ing].nombre:'?',p=parseAR(fl.pct);

function viewRespaldo(){if(!CAN_ADM)return '';var n=vals(S.pastoreos).length,h='<div class="card"><div class="chd"><span class="ct">Respaldo de datos · '+esc(empName())+'</span></div>';

function sortMovs(movs){var a=[];for(var i=0;i<movs.length;i++)a.push({m:movs[i],i:i});

function iniOf(g){var t=null;for(var i=0;i<(g.movs||[]).length;i++){var m=g.movs[i];if(m.tipo==='inicio'&&(t===null||m.fecha<t))t=m.fecha;}return t;}

  if(!best||(iniOf(g)||'')>(iniOf(best)||''))best=g;}return best;}
/* existencias por categoría hasta una fecha (inclusive). Devuelve {st:{cat:{cab,kgE,cabE}}, neg:{cat,fecha,cab}|null} */
function stockOf(movs,hasta){var st={},neg=null,ms=sortMovs(movs);

    if(s==='E'){st[c].cab+=m.cab;st[c].kgE+=m.cab*(m.kg||0);st[c].cabE+=m.cab;}else st[c].cab-=m.cab;

  var o={};for(var k in st)if(st[k].cab!==0)o[k]=st[k];return {st:o,neg:neg};}

  msg='';if(!saveCfg(c)){msg=LS_ERR;msgErr=true;}render();}
function guardarCpv(v){if(!CAN)return;var x=parseAR(v),c=clone(S.cfg);if(x===null||x<=0||x>10){msg='El consumo tiene que estar entre 0,1 y 10 % del peso vivo.';msgErr=true;return render();}
  c.consumoPV=x/100;msg='';if(!saveCfg(c)){msg=LS_ERR;msgErr=true;}render();}
function viewExistencias(){calc();var ps=byName(vals(S.lotes)),i,rows=[],porCat={},tc=0,tk=0,tev=0,d=hoy(),gsx;
  gsx=vals(S.pastoreos);for(i=0;i<gsx.length;i++){var g=gsx[i];if(isClosed(g)||!(g.movs||[]).length)continue;var p={nombre:gName(g),ha:gHa(g)};
    var st=stockOf(g.movs,d).st,t=totSt(st);if(t.cab<=0)continue;var ev=evStock(st);rows.push({p:p,g:g,st:st,t:t,ev:ev});tc+=t.cab;tk+=t.kg;tev+=ev;
    for(var c in st){if(!porCat[c])porCat[c]={cab:0,kg:0,ev:0,pot:0};var P=kgProm(st,c)||0;porCat[c].cab+=st[c].cab;porCat[c].kg+=st[c].cab*P;porCat[c].ev+=P?st[c].cab*evCab(P,0):0;porCat[c].pot++;}}
  rows.sort(function(a,b){return a.p.nombre.localeCompare(b.p.nombre,'es');});var G=ganInfo();
  function mc(l,v,u2,hl){return '<div class="mc"'+(hl?'':' style="border-left-color:var(--border)"')+'><div class="mc-lbl">'+l+'</div><div class="mc-val">'+v+(u2?'<span class="mc-unit">'+u2+'</span>':'')+'</div></div>';}
  var h='<h2 style="font-size:22px;font-weight:700;margin:4px 0 12px;color:var(--text)">Situación a la fecha '+d.substr(8,2)+'/'+d.substr(5,2)+'/'+d.substr(0,4)+'</h2><div class="g2"><div style="display:flex;flex-direction:column;gap:12px;min-width:0">';

    '<tr><td>Tasa de crecimiento neta requerida <span class="msg">(carga × consumo)</span></td><td class="r" style="font-weight:600">'+f(tcn,1)+' kg MS/ha/día</td></tr>'+
    '<tr><td>Eficiencia de pastoreo estimada</td><td class="r">'+efCell+'</td></tr>'+

    '<tr><td>Tasa de crecimiento bruta actual ponderada <span class="msg">(recursos de la superficie ganadera)</span></td><td class="r">'+f(TP.v,1)+' kg MS/ha/día'+(TP.nS&&TP.v!==null?' <span class="bdg by">parcial</span>':'')+'</td></tr>'+
    '<tr><td>Balance <span class="msg">(actual − requerida bruta)</span></td><td class="r" style="font-weight:600;color:'+(bal===null?'var(--muted)':bal>=0?'var(--ok-t)':'var(--bad-t)')+'">'+(bal===null?'—':(bal>0?'+':'')+f(bal,1)+' kg MS/ha/día')+'</td></tr>'+
    '<tr><td>Consumo diario del rodeo <span class="msg">(kg vivos × consumo)</span></td><td class="r">'+f(tk*S.cfg.consumoPV)+' kg MS/día</td></tr>'+
    '<tr><td>Déficit de crecimiento bruto <span class="msg">((requerida bruta − actual ponderada) × ha ganaderas; 0 si sobra)</span></td><td class="r">'+(defB===null?'—':f(defB)+' kg MS/día'+parc)+'</td></tr>'+
    '<tr class="tr-ref"><td>Necesidad de suplementación <span class="msg" style="font-weight:400">(déficit bruto × eficiencia)</span></td><td class="r">'+(necS===null?'—':f(necS)+' kg MS/día'+parc)+'</td></tr>'+
    '</tbody></table></div><div class="pnote">La tasa neta es el forraje que tiene que crecer por hectárea y por día para sostener la carga actual con el consumo en % del peso vivo indicado. La bruta suma lo que se pierde por pisoteo, senescencia y rechazo: se compara con la tasa de crecimiento del recurso. El déficit bruto es el crecimiento que falta en toda la superficie ganadera; la necesidad de suplementación lo pasa a forraje consumido (el suplemento no tiene pérdidas de pastoreo) y es comparable con los kg MS de suplemento entregados.'+(ef==null?' Cargá la eficiencia de pastoreo para calcular la tasa bruta.':'')+(msg?' '+esc(msg):'')+'</div></div>';
  h+='</div>';
  /* superficie ganadera y carga */

    '<div class="metrics" style="margin-bottom:12px;grid-template-columns:repeat(auto-fill,minmax(130px,1fr))">'+mc('Superficie ganadera',f(G.ha,2),'ha',true)+mc('Carga',G.ha?f(tk/G.ha):'—','kg/ha',true)+mc('Carga',G.ha?f(tev/G.ha,2):'—','EV/ha',true)+mc('Cabezas/ha',G.ha?f(tc/G.ha,2):'—')+'</div>'+
    ganTabla(G,false,true)+'<div class="pnote">Carga = hacienda total en pastoreo ÷ superficie ganadera actual (campaña '+esc(campName(CAMP))+'). La tasa de crecimiento bruta actual de cada recurso es un valor estimado que cargás vos (celdas verdes); el total la pondera por la superficie de cada recurso.'+(TP.nS&&TP.v!==null?' Es parcial: falta cargar '+TP.nS+' recursos ('+f(TP.haS,2)+' ha).':'')+(G.fuera?' Hay '+f(G.fuera)+' cabezas en lotes que no están marcados como superficie ganadera: igual suman a la carga.':'')+(G.man?' '+G.man+' lotes corregidos a mano.':'')+'</div></div>';

  return h+'<div class="pnote">kg/ha y EV/ha de cada lote son la carga instantánea sobre su propia superficie. Hacé clic en un lote para ver el pastoreo.</div></div>';}

function suplMs(g){var t=0,sp=g.supl||[];for(var i=0;i<sp.length;i++)t+=kgMsOf(sp[i])||0;return t;}

  if(sel2&&!hay)h+='<option value="'+sel2+'" selected>'+esc(rodName(sel2))+'</option>';return h;}

/* rodeos con hacienda hoy en el pastoreo: {rodeoId: cabezas}; '' = sin rodeo */
function rodsEnLote(g){var o={},st=stockRC((g&&g.movs)||[],hoy()).st;for(var c in st){if(st[c].cab<=0)continue;var r=rcRod(c);o[r]=(o[r]||0)+st[c].cab;}return o;}
function rodLoteHtml(g){var o=rodsEnLote(g),ks=[],k,i,t=[];for(k in o)ks.push(k);
  ks.sort(function(a,b){if(!a)return 1;if(!b)return -1;return rodName(a).localeCompare(rodName(b),'es');});

function conRod(m,rod){if(rod)m.rodeoId=rod;else delete m.rodeoId;return m;}
function lastRod(g){var ms=sortMovs((g&&g.movs)||[]);for(var i=ms.length-1;i>=0;i--)if(ms[i].rodeoId&&sgn(ms[i])==='E')return ms[i].rodeoId;return '';}
/* existencias por rodeo y categoría: clave rodeoId|categoriaId (rodeo vacío = sin rodeo) */
function stockRC(movs,hasta){var st={},neg=null,ms=sortMovs(movs||[]);
  for(var i=0;i<ms.length;i++){var m=ms[i];if(hasta&&m.fecha>hasta)break;var c=(m.rodeoId||'')+'|'+m.categoriaId,s=sgn(m);if(!st[c])st[c]={cab:0,kgE:0,cabE:0};
    if(s==='E'){st[c].cab+=m.cab;st[c].kgE+=m.cab*(m.kg||0);st[c].cabE+=m.cab;}else st[c].cab-=m.cab;
    if(st[c].cab<0&&!neg)neg={cat:c,fecha:m.fecha,cab:st[c].cab};}
  var o={};for(var k in st)if(st[k].cab!==0)o[k]=st[k];return {st:o,neg:neg};}
function rcRod(k){return k.substr(0,k.indexOf('|'));}
function rcCat(k){return k.substr(k.indexOf('|')+1);}

function rcOptions(st,sel2){var ks=rcKeys(st),h='<option value="">Elegí</option>';
  for(var i=0;i<ks.length;i++){if(st[ks[i]].cab<=0)continue;h+='<option value="'+ks[i]+'"'+(ks[i]===sel2?' selected':'')+'>'+esc(rcName(ks[i]))+' ('+f(st[ks[i]].cab)+' cab)</option>';}return h;}
function guardarRodeoG(){if(!CAN||!S.pastoreos[SEL])return;if(!FORM.rod)return ferr('Elegí el rodeo.');var g=clone(S.pastoreos[SEL]);
  for(var i=0;i<(g.movs||[]).length;i++)g.movs[i].rodeoId=FORM.rod;if(!savePast(SEL,g))return ferr(LS_ERR);ACT=null;FORM=null;render();}

/* hacienda actual agrupada: campo > rodeo > categoría (pastoreos abiertos a la fecha) */
function existArbol(gs,d){var A={},i,c;
  for(i=0;i<gs.length;i++){var g=gs[i];if(isClosed(g)||!(g.movs||[]).length)continue;var st=stockRC(g.movs,d).st;
    for(c in st){if(st[c].cab<=0)continue;var rod=rcRod(c),cat=rcCat(c),R=rod&&S.rodeos[rod],cid=R?(R.negocioId||''):'',P=kgProm(st,c)||0;
      if(!A[cid])A[cid]={};if(!A[cid][rod])A[cid][rod]={};if(!A[cid][rod][cat])A[cid][rod][cat]={cab:0,kg:0,ev:0};
      var x=A[cid][rod][cat];x.cab+=st[c].cab;x.kg+=st[c].cab*P;x.ev+=kgProm(st,c)!=null?st[c].cab*evCab(P,0):0;}}
  return A;}
function xOpen(k,lv){return XOPEN.hasOwnProperty(k)?XOPEN[k]:lv<XLV;}

function arbolExist(gs,d){var A=existArbol(gs,d),T={cab:0,kg:0,ev:0},i,j,k;

  var cids=[];for(var ck in A)cids.push(ck);cids.sort(function(a,b){if(!a)return 1;if(!b)return -1;return negName(a).localeCompare(negName(b),'es');});
  var body='';
  for(i=0;i<cids.length;i++){var cid=cids[i],CA=A[cid],tc={cab:0,kg:0,ev:0},rods=[],rb='';for(var rk in CA)rods.push(rk);
    rods.sort(function(a,b){if(!a)return 1;if(!b)return -1;return rodName(a).localeCompare(rodName(b),'es');});
    var kc='c:'+cid,oc=xOpen(kc,1);
    for(j=0;j<rods.length;j++){var rod=rods[j],RA=CA[rod],tr={cab:0,kg:0,ev:0},cats=[],cb='';for(var cc in RA)cats.push(cc);cats.sort(function(a,b){return catOrd(a)-catOrd(b);});
      var kr='r:'+cid+'|'+rod,or=xOpen(kr,2);
      for(k=0;k<cats.length;k++){add(tr,RA[cats[k]]);cb+='<tr><td style="padding-left:44px">'+esc(cName(cats[k]))+'</td>'+cells(RA[cats[k]])+'</tr>';}
      add(tc,tr);
      rb+='<tr class="click" onclick="xTog(\''+kr+'\',2)"><td style="padding-left:24px;font-weight:600">'+(or?'▾ ':'▸ ')+(rod?esc(rodName(rod)):'<span class="msg">Sin rodeo</span>')+'</td>'+cells(tr)+'</tr>'+(or?cb:'');}
    add(T,tc);
    body+='<tr class="click tr-grp" onclick="xTog(\''+kc+'\',1)"><td style="font-weight:700">'+(oc?'▾ ':'▸ ')+(cid?esc(negName(cid)):'<span class="msg">Sin unidad de negocio</span>')+'</td>'+cells(tc)+'</tr>'+(oc?rb:'');}
  var bt=function(n,l){return '<button class="btn'+(XLV===n&&!hayX()?' pri':'')+'" onclick="xNivel('+n+')">'+l+'</button>';};
  var h='<div class="card"><div class="chd"><span class="ct">Hacienda por unidad de negocio, rodeo y categoría al '+fFecha(d)+'</span><div class="tools">'+bt(1,'Unidades de negocio')+bt(2,'Rodeos')+bt(3,'Categorías')+'</div></div>';
  h+='<div class="tw"><table><thead><tr><th>Unidad de negocio › rodeo › categoría</th><th class="r">Cabezas</th><th class="r">kg totales</th><th class="r">kg/cab</th><th class="r">EV totales</th><th class="r">EV/cab</th></tr></thead><tbody>';
  if(!cids.length)body='<tr><td colspan="6"><div class="empty">No hay hacienda en pastoreo.</div></td></tr>';
  h+=body+'<tr class="tr-ref"><td>Total</td>'+cells(T)+'</tr></tbody></table></div>';
  return h+'<div class="pnote">El rodeo se toma de cada movimiento de hacienda y la unidad de negocio, del rodeo. La hacienda cargada sin rodeo aparece aparte: asignalo desde cada pastoreo con “Asignar rodeo”. kg/cab = pesada de entrada de cada ingreso. EV/cab = a + b·P con los coeficientes de Parámetros y ADPV 0, porque la hacienda en pastoreo todavía no tiene pesada de salida. Tocá una fila para abrirla o cerrarla.</div></div>';}

  if(!xs.length)h+='<tr><td colspan="5"><div class="empty">Todavía no hay rodeos. Creá uno por cada grupo de hacienda que manejás.</div></td></tr>';
  return h+'</tbody></table></div><div class="pnote">Cada rodeo pertenece a una unidad de negocio. Si hay rodeos activos, al cargar hacienda nueva hay que elegir el rodeo. La hacienda cargada antes queda “sin rodeo”: asignalo desde cada pastoreo con “Asignar rodeo”.</div></div>';}

/* ---- retirar / pase: una fila por rodeo · categoría que hay en el lote ---- */
function filasSalida(g,fecha,prev){var st=stockRC(g.movs,fecha||hoy()).st,ks=rcKeys(st),o={};
  for(var i=0;i<ks.length;i++){var k=ks[i];if(st[k].cab<=0)continue;var p=prev&&prev[k];o[k]=p?p:{cab:'',kg:kgProm(st,k)?String(Math.round(kgProm(st,k))):''};}return o;}
function abrirSalida(k){var g=S.pastoreos[SEL];setAct('retirar',{fecha:hoy(),tipo:k==='pase'?'pase_otro':'tras_s',destino:'',obs:'',rows:filasSalida(g,hoy(),null),confAd:false});}
function salFecha(v){FORM.fecha=v;FORM.rows=filasSalida(S.pastoreos[SEL],v,FORM.rows);render();}
function formSalida(g){var st=stockRC(g.movs,FORM.fecha||hoy()).st,ks=[],k,esPO=FORM.tipo==='pase_otro',esP=esPO||FORM.tipo==='pase_s',ret=!esPO;
  /* Los dos pases cargan la entrada en el lote destino. “Pase salida” (pase_s): sale una parte. “Pase a otro lote” (pase_otro, se guarda como pase_s): sale el total. */
  if(esPO)for(k in FORM.rows)FORM.rows[k].cab=st[k]&&st[k].cab>0?String(st[k].cab):'';
  for(k in FORM.rows)ks.push(k);ks=rcKeys((function(){var o={};for(var i=0;i<ks.length;i++)o[ks[i]]=1;return o;})());
  var h='<div class="form"><label class="wide" style="text-transform:none;font-size:12px;color:var(--text);font-weight:600">Salidas hacienda</label>'+
    '<label>Fecha<input class="ed" type="date" value="'+esc(FORM.fecha)+'" onchange="salFecha(this.value)"></label>'+
    '<label>Movimiento'+sel('tipo',tipoOpts(TIPOS_S.concat(['pase_s']),FORM.tipo)+'<option value="pase_otro"'+(esPO?' selected':'')+'>Pase a otro lote</option>')+'</label>'+
    (esP?'<label>Lote destino (todas las filas)<select class="ed" onchange="salDestTodas(this.value)">'+potOptions(FORM.destino||'',g.loteId)+'</select></label>':'')+defMov(FORM.tipo);
  if(!ks.length)return h+'<div class="msg" style="grid-column:1/-1">El lote no tiene hacienda a esa fecha. Si el pastoreo terminó, cerralo con “Cerrar sin hacienda”: se registra el fin del pastoreo en la fecha elegida.</div>'+
    '<div class="form-actions"><button class="btn pri" onclick="cerrarSinHac()">Cerrar sin hacienda</button><button class="btn" onclick="cerrarAct()">Cancelar</button>'+formMsg()+'</div></div>';
  if(!esP)h+='<div style="grid-column:1/-1"><button class="btn" onclick="salTodas()">Sale toda la hacienda</button></div>';
  h+='<div class="tw" style="grid-column:1/-1"><table><thead><tr><th>Rodeo</th><th>Categoría</th><th class="r">En el lote</th><th class="r">kg/cab entrada</th>'+(esP?'<th>Lote destino</th><th>Rodeo destino</th>':'')+'<th class="r">Cabezas que salen</th><th class="r">kg/cab '+(esP?'pesada':'salida')+'</th>'+(DS_S[FORM.tipo]?'<th class="r">kg/cab destino</th><th class="r">% desbaste</th>':'')+'</tr></thead><tbody>';
  for(var i=0;i<ks.length;i++){k=ks[i];var r=FORM.rows[k],q=st[k]||{cab:0},kq='FORM.rows[\''+k+'\']';
    h+='<tr><td>'+esc(rodName(rcRod(k)))+'</td><td class="tdname">'+esc(cName(rcCat(k)))+'</td><td class="r">'+f(q.cab)+'</td><td class="r">'+f(kgProm(st,k))+'</td>';
    if(esP)h+='<td><select class="ed" aria-label="Lote destino" onchange="'+kq+'.lote=this.value;'+kq+'.rodD=null;render()">'+potOptions(r.lote||'',g.loteId)+'</select>'+
      (r.lote?'<div class="msg" style="font-size:11px">'+(openOf(r.lote)?'En curso #'+openOf(r.lote).num:'Pastoreo nuevo')+'</div>':'')+'</td>'+
      '<td><select class="ed" aria-label="Rodeo destino" onchange="'+kq+'.rodD=this.value"'+(r.lote?'':' disabled')+'>'+(r.lote?rodDestOptions(rcRod(k),r.rodD!=null?r.rodD:rcRod(k),rodsEnLote(openOf(r.lote))):'<option>Elegí el lote</option>')+'</select></td>';
    h+='<td class="r"><input class="ed" inputmode="numeric" aria-label="Cabezas que salen" style="width:90px;text-align:right" value="'+esc(r.cab)+'"'+(esPO?' readonly title="Pase a otro lote: sale toda la hacienda"':' oninput="'+kq+'.cab=this.value"')+'></td>'+
      '<td class="r"><input class="ed" inputmode="decimal" aria-label="kg por cabeza" style="width:90px;text-align:right" value="'+esc(r.kg)+'" oninput="'+kq+'.kg=this.value;dsFila(\''+k+'\','+i+')"></td>'+
      (DS_S[FORM.tipo]?'<td class="r"><input class="ed" inputmode="decimal" aria-label="kg por cabeza en destino" style="width:90px;text-align:right" value="'+esc(r.kgD||'')+'" oninput="'+kq+'.kgD=this.value;dsFila(\''+k+'\','+i+')"></td><td class="r" id="ds_'+i+'">'+dsTxt(FORM.tipo,r.kg,r.kgD)+'</td>':'')+'</tr>';}
  if(!ks.length)h+='<tr><td colspan="'+(esP?8:DS_S[FORM.tipo]?8:6)+'"><div class="empty">No hay hacienda en el lote a esa fecha.</div></td></tr>';
  h+='</tbody></table><div class="msg" style="margin-top:4px">'+(FORM.tipo==='pase_s'?'Pase salida: sale una parte de la hacienda; en el lote tiene que quedar hacienda. La entrada se carga sola en cada lote destino con el rodeo elegido. ':esPO?'Pase a otro lote: sale toda la hacienda (las cabezas no se pueden cambiar) y el pastoreo se cierra. Cada fila puede ir a un lote y rodeo distinto; la entrada se carga sola en cada destino. ':'')+'Cargá las cabezas solo en las categorías que salen. El kg/cab viene con la pesada de entrada: cambialo si pesaste'+(FORM.tipo==='mort'?' (en mortandad se puede dejar vacío)':'')+'. Si sale toda la hacienda, el pastoreo se cierra.</div></div>'+
    '<label class="wide">Observaciones'+inp('obs')+'</label>';
  if(FORM.adWarn)h+='<div class="msg err" style="grid-column:1/-1">'+esc(FORM.adWarn)+' <button class="btn warn" onclick="FORM.confAd=true;guardarSalida()">Guardar igual</button></div>';
  if(FORM.dsWarn)h+='<div class="msg err" style="grid-column:1/-1">'+esc(FORM.dsWarn)+' <button class="btn warn" onclick="FORM.confDs=true;guardarSalida()">Guardar igual</button></div>';
  return h+'<div class="form-actions"><button class="btn pri" onclick="guardarSalida()">Guardar</button><button class="btn" onclick="cerrarAct()">Cancelar</button>'+formMsg()+'</div></div>';}
function salTodas(){var st=stockRC(S.pastoreos[SEL].movs,FORM.fecha||hoy()).st;for(var k in FORM.rows)FORM.rows[k].cab=st[k]&&st[k].cab>0?String(st[k].cab):'';render();}
function cerrarSinHac(){if(!CAN||!S.pastoreos[SEL])return;var g=clone(S.pastoreos[SEL]),ini=iniOf(g),ms=sortMovs(g.movs),u=ms[ms.length-1];
  if(!okFecha(FORM.fecha))return ferr('La fecha tiene que ser válida y no posterior a hoy.');
  if(ini&&FORM.fecha<ini)return ferr('La fecha no puede ser anterior al inicio del pastoreo ('+fFecha(ini)+').');
  if(u&&FORM.fecha<u.fecha)return ferr('Hay movimientos posteriores a esa fecha ('+fFecha(u.fecha)+').');
  if(totSt(stockOf(g.movs,null).st).cab>0)return ferr('El lote todavía tiene hacienda: cargá la salida.');
  g.movs.push({id:newId(),fecha:FORM.fecha,tipo:'fin',categoriaId:u?u.categoriaId:'',cab:0,kg:0,obs:'Cierre sin hacienda',cierra:true});
  if(!savePast(SEL,g))return ferr(LS_ERR);ACT=null;FORM=null;render();}
function salDestTodas(v){FORM.destino=v;for(var k in FORM.rows){FORM.rows[k].lote=v;FORM.rows[k].rodD=null;}render();}
function guardarSalida(){if(!CAN||FORM.busy||!S.pastoreos[SEL])return;var g=clone(S.pastoreos[SEL]),ini=iniOf(g),esPO=FORM.tipo==='pase_otro',tipo=esPO?'pase_s':FORM.tipo,esP=tipo==='pase_s',esPase=esP,i,k;
  if(!okFecha(FORM.fecha))return ferr('La fecha tiene que ser válida y no posterior a hoy.');
  if(ini&&FORM.fecha<ini)return ferr('La fecha no puede ser anterior al inicio del pastoreo ('+fFecha(ini)+').');
  var st=stockRC(g.movs,FORM.fecha).st,items=[];
  if(esPO)for(k in FORM.rows)FORM.rows[k].cab=st[k]&&st[k].cab>0?String(st[k].cab):''; /* pase a otro lote: sale el total */
  for(k in FORM.rows){var r=FORM.rows[k],nm=rcName(k);if(String(r.cab||'').replace(/\s/g,'')==='')continue;var cab=num(r.cab),kg=num(r.kg),lote=esP?(r.lote||''):'';
    if(cab===null||cab<=0||Math.round(cab)!==cab)return ferr('Las cabezas de '+nm+' tienen que ser un número entero mayor que cero.');
    if(!st[k]||cab>st[k].cab)return ferr('En el lote hay '+f(st[k]?st[k].cab:0)+' cabezas de '+nm+' a esa fecha.');
    if(tipo!=='mort'&&(kg===null||kg<=0||kg>1200))return ferr('Cargá el kg/cab de '+nm+' (entre 1 y 1.200).');
    if(tipo==='mort'&&kg!==null&&(kg<0||kg>1200))return ferr('El kg/cab de '+nm+' tiene que estar entre 0 y 1.200, o vacío.');
    if(esPase&&!lote)return ferr('Elegí el lote destino de '+nm+'.');
    var kgD=null;if(DS_S[tipo]){kgD=num(r.kgD);if(kgD===null||kgD<=0||kgD>1200)return ferr('Cargá la pesada en destino de '+nm+' (entre 1 y 1.200).');
      var dw=dsAviso(tipo,kg,kgD,nm);if(dw&&!FORM.confDs){FORM.dsWarn=dw;return render();}}
    var rdX=lote?(r.rodD!=null?r.rodD:rcRod(k)):'';if(rdX&&!mismoNeg(rcRod(k),rdX))return ferr('El rodeo destino de '+nm+' es de otra unidad de negocio: los pases son dentro de la misma unidad (usá Traslado salida).');
    items.push({cat:rcCat(k),rod:rcRod(k),rodD:rdX,lote:lote,cab:cab,kg:kg,kgD:kgD});}
  if(!items.length)return ferr('Cargá las cabezas de al menos una categoría.');
  var nuevos=[];
  for(i=0;i<items.length;i++){var it=items[i],m=conRod({id:newId(),fecha:FORM.fecha,tipo:tipo,categoriaId:it.cat,cab:it.cab,kg:it.kg,obs:(it.lote?'Pase a '+pName(it.lote)+(it.rodD?' ('+rodName(it.rodD)+')':'')+(FORM.obs?' · ':''):'')+(FORM.obs||'')},it.rod);
    if(it.lote){m.destinoLoteId=it.lote;if(it.rodD)m.destinoRodeoId=it.rodD;}if(it.kgD!=null)m.kgDestino=it.kgD;nuevos.push(m);}
  var movs=g.movs.concat(nuevos),chk=stockOf(movs,null),chkR=stockRC(movs,null);
  if(esP&&!esPO&&totSt(stockOf(movs,FORM.fecha).st).cab<=0)return ferr('Pase salida es para una parte de la hacienda: si sale toda, usá “Pase a otro lote”.');
  if(chk.neg)return ferr('Con esa salida quedarían '+f(chk.neg.cab)+' cabezas de '+cName(chk.neg.cat)+' el '+fFecha(chk.neg.fecha)+'. Revisá las cabezas o la fecha.');
  if(chkR.neg)return ferr('Con esa salida quedarían '+f(chkR.neg.cab)+' cabezas de '+rcName(chkR.neg.cat)+' el '+fFecha(chkR.neg.fecha)+'. Revisá las cabezas o la fecha.');
  if(totSt(stockOf(movs,FORM.fecha).st).cab===0){var post=null;for(i=0;i<g.movs.length;i++)if(g.movs[i].fecha>FORM.fecha&&(!post||g.movs[i].fecha<post))post=g.movs[i].fecha;
    if(post)return ferr('Con esta salida el lote queda sin hacienda el '+fFecha(FORM.fecha)+', pero hay movimientos posteriores ('+fFecha(post)+'). Revisá la fecha.');}
  if(totSt(chk.st).cab===0){var srt=sortMovs(movs),ult=srt[srt.length-1],esN=false;for(i=0;i<nuevos.length;i++)if(nuevos[i].id===ult.id)esN=true;if(esN)for(i=0;i<nuevos.length;i++)nuevos[i].cierra=true;}
  g.movs=movs;
  if(nuevos[0].cierra&&!FORM.confAd){var ev=evalG(g);if(ev&&ev.AD!=null&&(ev.AD<ADPV_MIN||ev.AD>ADPV_MAX)){FORM.adWarn='Con estas pesadas el ADPV del pastoreo da '+f(ev.AD,2)+' kg/día, fuera del rango válido. Revisá los kg/cab.';return render();}}
  /* pase a otro lote: una entrada por lote destino, con el rodeo elegido en cada fila */
  var dests=[];if(esPase){var porL={},ord=[];for(i=0;i<items.length;i++){var L=items[i].lote;if(!porL[L]){porL[L]=[];ord.push(L);}porL[L].push({cat:items[i].cat,rod:items[i].rodD,cab:items[i].cab,kg:items[i].kg});}
    for(i=0;i<ord.length;i++){var d=prepDestino(ord[i],FORM.fecha,porL[ord[i]],gName(g),g.campaniaId);if(typeof d==='string')return ferr(pName(ord[i])+': '+d);dests.push(d);}}
  var gid=SEL;if(!savePast(gid,g))return ferr(LS_ERR);
  for(i=0;i<dests.length;i++)if(!savePast(dests[i].id,dests[i].doc))return ferr(LS_ERR+' La salida se guardó: cargá la entrada en '+pName(dests[i].doc.loteId)+' a mano.');ACT=null;FORM=null;render();}

/* ===================== CAMBIOS DE CATEGORÍA ===================== */
/* Cada cambio = salida (cat_s) de la categoría actual + entrada (cat_e) a la nueva, con el mismo rodeo, fecha, cabezas y kg/cab.
   Los kg que salen y entran son iguales: el ADPV y la cosecha del pastoreo no cambian. */
function filasCambio(g,fecha,prev){var st=stockRC(g.movs,fecha||hoy()).st,ks=rcKeys(st),o={};
  for(var i=0;i<ks.length;i++){var k=ks[i];if(st[k].cab<=0)continue;o[k]=prev&&prev[k]?prev[k]:{cab:'',nueva:'',kg:kgProm(st,k)?String(Math.round(kgProm(st,k))):''};}return o;}
function abrirCambio(){var g=S.pastoreos[SEL];setAct('categoria',{fecha:hoy(),obs:'',rows:filasCambio(g,hoy(),null)});}
function camFecha(v){FORM.fecha=v;FORM.rows=filasCambio(S.pastoreos[SEL],v,FORM.rows);render();}
function formCambio(g){var st=stockRC(g.movs,FORM.fecha||hoy()).st,o={},k,ks;for(k in FORM.rows)o[k]=1;ks=rcKeys(o);
  var h='<div class="form"><label class="wide" style="text-transform:none;font-size:12px;color:var(--text);font-weight:600">Cambios de categoría</label>'+
    '<label>Fecha<input class="ed" type="date" value="'+esc(FORM.fecha)+'" onchange="camFecha(this.value)"></label>';
  h+='<div class="tw" style="grid-column:1/-1"><table><thead><tr><th>Rodeo</th><th>Categoría actual</th><th class="r">Cabezas</th><th class="r">kg totales</th><th class="r">kg/cab</th><th class="r">Cabezas que cambian</th><th>Nueva categoría</th><th class="r">kg/cab</th></tr></thead><tbody>';
  for(var i=0;i<ks.length;i++){k=ks[i];var r=FORM.rows[k],q=st[k]||{cab:0},P=kgProm(st,k);
    h+='<tr><td>'+esc(rodName(rcRod(k)))+'</td><td class="tdname">'+esc(cName(rcCat(k)))+'</td><td class="r">'+f(q.cab)+'</td><td class="r">'+f(P?q.cab*P:null)+'</td><td class="r">'+f(P)+'</td>'+
      '<td class="r"><input class="ed" inputmode="numeric" aria-label="Cabezas que cambian" style="width:90px;text-align:right" value="'+esc(r.cab)+'" oninput="FORM.rows[\''+k+'\'].cab=this.value"></td>'+
      '<td><select class="ed" aria-label="Nueva categoría" onchange="FORM.rows[\''+k+'\'].nueva=this.value">'+catOptions(r.nueva)+'</select></td>'+
      '<td class="r"><input class="ed" inputmode="decimal" aria-label="kg por cabeza" style="width:90px;text-align:right" value="'+esc(r.kg)+'" oninput="FORM.rows[\''+k+'\'].kg=this.value"></td></tr>';}
  if(!ks.length)h+='<tr><td colspan="8"><div class="empty">No hay hacienda en el lote a esa fecha.</div></td></tr>';
  h+='</tbody></table><div class="msg" style="margin-top:4px">Las cabezas salen de su categoría y entran a la nueva en el mismo lote y rodeo. El kg/cab viene con la pesada de entrada: corregilo si pesaste. Se usa el mismo kg en la salida y en la entrada, así que el ADPV del pastoreo no cambia.</div></div>'+
    '<label class="wide">Observaciones'+inp('obs')+'</label>';
  return h+'<div class="form-actions"><button class="btn pri" onclick="guardarCambio()">Guardar</button><button class="btn" onclick="cerrarAct()">Cancelar</button>'+formMsg()+'</div></div>';}

/* ===================== COSECHA (etapa 4) =====================
   Criterios:
   - Solo pastoreos cerrados y calculados (sin error ni ADPV fuera de rango). Los en curso no suman hasta cerrar.
   - La MS de pasto de cada pastoreo se reparte por mes según cabezas·día (monthly del motor, como el Excel).
     La campaña sale del mes (julio-junio): un pastoreo que cruza junio-julio se divide entre las dos campañas.
   - Suplemento: kg MS de las entregas de esos mismos pastoreos, por mes de la entrega.
   - kg MS/ha: dividido por la superficie ganadera del recurso en la campaña (lotes con ese recurso GAN en el Plan de Uso).
   - Colores: un color fijo por recurso desde COLOR_REC; terracota reservado para el suplemento. */
var CF={camp:'',campo:'',rec:'',uni:'ms'},CHC=[],MES_CAMP=['07','08','09','10','11','12','01','02','03','04','05','06'];
var PAL_REC=['#4A6533','#8BA05E','#6E8B8F','#D9B26F','#9C7A4E','#B9C99A','#55707A','#C9B79C','#7F9C6B','#A3A58A','#5E6E3A','#B4A27A','#8FA9AD','#D6C9A8','#6B5B3E'];
function campDeMes(ym2){var y=+ym2.substr(0,4),m=+ym2.substr(5,2),a=m>=7?y:y-1;function dd(n){n=n%100;return (n<10?'0':'')+n;}return dd(a)+'-'+dd(a+1);}
function mesesCamp(c){var a=2000+(+c.substr(0,2)),o=[];for(var i=0;i<12;i++){var mm=MES_CAMP[i];o.push((i<6?a:a+1)+'-'+mm);}return o;}
function colorRec(){var ts=[],k,o={};for(k in S.tipos)if(esGan(k))ts.push(S.tipos[k]);ts=byName(ts);for(var i=0;i<ts.length;i++)o[ts[i].id]=PAL_REC[i%PAL_REC.length];o['']='#A0A8B0';return o;}
function campoDeLote(id){var L=S.lotes[id];return L?L.campoId:'';}
/* superficie ganadera por recurso en una campaña (respeta el filtro de campo) */
function haRecCamp(c){var o={},ps=vals(S.lotes);for(var i=0;i<ps.length;i++){var p=ps[i];if(!p.ha)continue;if(CF.campo&&p.campoId!==CF.campo)continue;
  var as=actsDe(p.id,c),r=null;for(var j=0;j<as.length;j++)if(esGan(as[j].tipoActividadId)){r=as[j].tipoActividadId;break;}if(!r)continue;o[r]=(o[r]||0)+p.ha;}return o;}
function datosCosecha(){calc();var gs=vals(S.pastoreos),D={mes:{},supMes:{},lot:{},cnt:{ok:0,curso:0,err:0},camps:{},porCampMes:{}},i,k;
  for(i=0;i<gs.length;i++){var g=gs[i],o=BYG[g.id],rec=g.tipoActividadId||'';
    if(CF.campo&&campoDeLote(g.loteId)!==CF.campo)continue;if(CF.rec&&rec!==CF.rec)continue;
    var enC=g.campaniaId===CF.camp;
    if(!o||o.err.length||o.adFuera){if(enC)D.cnt.err++;continue;}
    if(o.abierto||o.past==null){if(enC)D.cnt.curso++;continue;}
    var mm=monthly(o),toca=false;
    for(k in mm){var c=campDeMes(k);D.camps[c]=1;if(!D.porCampMes[c])D.porCampMes[c]={};D.porCampMes[c][k]=(D.porCampMes[c][k]||0)+mm[k];
      if(c!==CF.camp)continue;toca=true;if(!D.mes[rec])D.mes[rec]={};D.mes[rec][k]=(D.mes[rec][k]||0)+mm[k];
      var lk=gKey(g);if(!D.lot[lk])D.lot[lk]={g:g,rec:rec,past:0,sup:0,n:{},dias:0};D.lot[lk].past+=mm[k];}
    var sp=0;for(var j=0;j<(g.supl||[]).length;j++){var s=g.supl[j],sm=(s.fecha||'').substr(0,7);if(!sm||campDeMes(sm)!==CF.camp)continue;var v=kgMsOf(s)||0;D.supMes[sm]=(D.supMes[sm]||0)+v;sp+=v;toca=true;
      var lk2=gKey(g);if(!D.lot[lk2])D.lot[lk2]={g:g,rec:rec,past:0,sup:0,n:{},dias:0};D.lot[lk2].sup+=v;}
    if(toca){D.cnt.ok++;var L2=D.lot[gKey(g)];if(L2){L2.n[g.id]=1;var ms2=mesesCamp(CF.camp),ini=ms2[0]+'-01',fin=ms2[11]+'-30';
      for(var t=0;t<o.iv.length;t++){var v2=o.iv[t];if(!v2.cab)continue;for(var dd=0;dd<v2.d;dd++){var ds2=ds(v2.t0+dd*DAY);if(ds2>=ini&&ds2<=fin)L2.dias++;}}}}}
  return D;}
function camOpts(){var cs={},i,gs=vals(S.pastoreos);for(i=0;i<gs.length;i++)if(gs[i].campaniaId)cs[gs[i].campaniaId]=1;cs[CAMP]=1;var l=[];for(var k in cs)l.push(k);l.sort();return l;}
function viewCosecha(){if(!CF.camp)CF.camp=CAMP;var D=datosCosecha(),COL=colorRec(),ms=mesesCamp(CF.camp),HA=haRecCamp(CF.camp),i,k,r;
  var cl=camOpts(),co='';for(i=0;i<cl.length;i++)co+='<option value="'+cl[i]+'"'+(CF.camp===cl[i]?' selected':'')+'>'+esc(campName(cl[i]))+'</option>';
  var fo='<option value="">Todos</option>';for(k in S.campos)fo+='<option value="'+k+'"'+(CF.campo===k?' selected':'')+'>'+esc(S.campos[k].nombre)+'</option>';
  var ro='<option value="">Todos</option>',rl=[];for(k in S.tipos)if(esGan(k))rl.push(S.tipos[k]);rl=byName(rl);for(i=0;i<rl.length;i++)ro+='<option value="'+rl[i].id+'"'+(CF.rec===rl[i].id?' selected':'')+'>'+esc(rl[i].nombre)+'</option>';
  function fs(lbl,code,opts){return '<label class="fr">'+lbl+' <select onchange="'+code+'=this.value;render()">'+opts+'</select></label>';}
  var h='<div class="card"><div class="chd"><span class="ct">Cosecha de forraje (kg MS neta) · campaña '+esc(campName(CF.camp))+'</span><div class="tools">'+
    fs('Campaña','CF.camp',co)+fs('Campo','CF.campo',fo)+fs('Recurso','CF.rec',ro)+
    '<span class="seg"><button class="btn'+(CF.uni==='ms'?' pri':'')+'" onclick="CF.uni=\'ms\';render()">kg MS</button><button class="btn'+(CF.uni==='ha'?' pri':'')+'" onclick="CF.uni=\'ha\';render()">kg MS/ha</button></span></div></div>';
  /* totales */
  var tP=0,tS=0,porRec={},haT=0;for(r in D.mes){porRec[r]=0;for(k in D.mes[r]){porRec[r]+=D.mes[r][k];tP+=D.mes[r][k];}}for(k in D.supMes)tS+=D.supMes[k];
  var recs={};for(r in HA)if(!CF.rec||r===CF.rec){recs[r]=1;haT+=HA[r];}for(r in porRec)recs[r]=1;
  function mc(l,v,u){return '<div class="mc"><div class="mc-lbl">'+l+'</div><div class="mc-val">'+v+(u?'<span class="mc-unit">'+u+'</span>':'')+'</div></div>';}
  h+='<div class="metrics">'+mc('Pasto cosechado (neto)',f(tP),'kg MS')+mc('Pasto por ha ganadera',haT?f(tP/haT):'—','kg MS/ha')+mc('Suplemento entregado',f(tS),'kg MS')+
    mc('Suplemento sobre el consumo',tP+tS?f(tS/(tP+tS)*100,1):'—','%')+
    '<div class="mc" style="border-left-color:var(--border)"><div class="mc-lbl">Pastoreos de la campaña</div><div style="font-size:13px;line-height:1.5"><b>'+f(D.cnt.ok)+'</b> calculados · '+f(D.cnt.curso)+' en curso · '+
    (D.cnt.err?'<a href="#historico" onclick="setTab(\'historico\');return false" style="color:var(--bad-t)">'+f(D.cnt.err)+' con error</a>':'0 con error')+'</div></div></div>';
  if(!tP&&!tS)h+='<div class="empty">No hay pastoreos cerrados con cosecha calculada en '+esc(campName(CF.camp))+(D.cnt.curso?' ('+f(D.cnt.curso)+' en curso: suman cuando cierran)':'')+'.</div>';
  h+='</div>';
  /* gráficos */
  h+='<div class="g2"><div class="card"><div class="chd"><span class="ct">Pasto cosechado por mes y recurso (kg MS neta)</span></div><div style="position:relative;height:300px"><canvas id="ch_mes"></canvas></div><div id="lg_mes" class="lgd"></div></div>'+
    '<div class="card"><div class="chd"><span class="ct">kg MS neta/ha por recurso</span></div><div style="position:relative;height:300px"><canvas id="ch_ha"></canvas></div></div></div>';
  /* tabla mes × recurso */
  var rk=[];for(r in recs)rk.push(r);rk.sort(function(a,b){return rName(a).localeCompare(rName(b),'es');});
  var u=CF.uni==='ha';
  h+='<div class="card"><div class="chd"><span class="ct">Pasto por mes y recurso · '+(u?'kg MS/ha':'kg MS')+'</span></div><div class="tw"><table><thead><tr><th>Recurso</th><th class="r">ha ganaderas</th>';

function cargarHistArchivo(inp){var fl=inp.files&&inp.files[0];if(!fl)return;var rd=new FileReader();
  rd.onload=function(){var o=null;try{o=JSON.parse(rd.result);}catch(e){}
    if(!o||o.herramienta!=='registro_pastoreos'||o.tipo!=='historico'||!o.hist||!o.hist.p){IMP.msg='El archivo no es un histórico del Registro de Pastoreos.';IMP.err=true;return render();}
    HIST=o.hist;PEND_EQ=o.pendEq||{};GRUPOS=o.grupos||{};HIST_INFO={cliente:o.cliente||'',empresa:o.empresa||'',fuente:o.fuente||'',archivo:fl.name};IMP={lot:{},ing:{},msg:'',err:false};render();};
  rd.onerror=function(){IMP.msg='No se pudo leer el archivo.';IMP.err=true;render();};
  rd.readAsText(fl,'utf-8');}
function viewImportArchivo(){return '<div class="card"><div class="chd"><span class="ct">Importar el histórico del Excel a '+esc(empName())+'</span></div>'+
  '<div class="msg" style="margin-bottom:8px">Elegí el archivo de histórico (.json) armado a partir del Excel de pastoreos. Se importa una sola vez por empresa; antes de importar vas a poder revisar las equivalencias de lotes e ingredientes.</div>'+
  '<div class="tools"><input type="file" accept=".json,application/json" onchange="cargarHistArchivo(this)">'+(IMP.msg?'<span class="msg'+(IMP.err?' err':'')+'">'+esc(IMP.msg)+'</span>':'')+'</div></div>';}
function viewImport(){if(yaImportado())return '<div class="card"><div class="chd"><span class="ct">Histórico del Excel</span><span class="bdg bg">Importado</span></div><div class="msg">Los pastoreos importados conservan la hoja y el número del Excel en “Origen”.</div></div>';
  if(!HIST)return viewImportArchivo();
  var d=diagImport(),i,k,h='<div class="card"><div class="chd"><span class="ct">Importar el histórico del Excel a '+esc(empName())+'</span></div>';
  if(HIST_INFO)h+='<div class="pnote" style="margin-bottom:8px">Archivo: '+esc(HIST_INFO.archivo)+(HIST_INFO.cliente?' · '+esc(HIST_INFO.cliente):'')+(HIST_INFO.empresa?' · '+esc(HIST_INFO.empresa):'')+'. Verificá que sea la empresa correcta antes de importar.</div>';
  h+='<div class="msg" style="margin-bottom:8px">'+f(HIST.p.length)+' pastoreos y '+f(HIST.pend.length)+' entregas sin pastoreo. Se importa una sola vez. Revisá las equivalencias antes de importar.</div>';
  /* lotes */
  var lopt=function(sel2){var o='<option value="">Sin lote</option>',ls=byName(vals(S.lotes));for(var j=0;j<ls.length;j++)o+='<option value="'+ls[j].id+'"'+(ls[j].id===sel2?' selected':'')+'>'+esc(ls[j].nombre)+' · '+esc(campoName(ls[j].campoId))+'</option>';return o;};
  h+='<div class="chd"><span class="ct">Lotes · '+f(d.nLot-d.lotesSin.length)+' de '+f(d.nLot)+' encontrados por nombre</span></div>';
  if(d.lotesSin.length){h+='<div class="tw scroll-y" style="max-height:260px"><table><thead><tr><th>Lote en el Excel</th><th class="r">ha Excel</th><th>Lote del sistema</th></tr></thead><tbody>';
    for(i=0;i<d.lotesSin.length;i++){k=d.lotesSin[i];h+='<tr><td class="tdname">'+esc(k)+'</td><td class="r">'+(HIST.lotes.hasOwnProperty(k)?f(HIST.lotes[k],2):'—')+'</td><td><select onchange="IMP.lot[\''+esc(k).replace(/'/g,"\\'")+'\']=this.value;render()">'+lopt(impLote(k))+'</select></td></tr>';}
    h+='</tbody></table></div>';}
  /* ingredientes */
  var iopt=function(sel2){var o='<option value="">Sin insumo</option>',is=byName(vals(S.insumos));for(var j=0;j<is.length;j++)o+='<option value="'+is[j].id+'"'+(is[j].id===sel2?' selected':'')+'>'+esc(is[j].nombre)+'</option>';return o;};
  h+='<div class="chd" style="margin-top:10px"><span class="ct">Ingredientes → insumos del sistema</span></div><div class="tw"><table><thead><tr><th>Ingrediente en el Excel</th><th class="r">% MS Excel</th><th>Insumo del sistema</th></tr></thead><tbody>';
  for(k in HIST.ing)h+='<tr><td class="tdname">'+esc(k)+'</td><td class="r">'+f(HIST.ing[k],1)+'%</td><td><select onchange="IMP.ing[\''+esc(k).replace(/'/g,"\\'")+'\']=this.value;render()">'+iopt(impIns(k))+'</select></td></tr>';
  h+='</tbody></table></div>';
  /* faltantes */
  var falt=[];var cs=[];for(k in d.campSin)cs.push(k);
  if(d.lotesSin.length)falt.push(d.lotesSin.length+' lotes del Excel que no están en el sistema');
  if(cs.length)falt.push('campañas que no existen en el sistema: '+cs.join(', '));
  if(d.insSin.length)falt.push('ingredientes sin insumo: '+d.insSin.join(', '));
  var as=[];for(k in d.actSin)as.push(k);
  h+='<div class="pnote" style="margin-top:10px">'+(falt.length?'<b>Para importar falta:</b> '+esc(falt.join(' · '))+'. Pedí a Rosario que lo agregue al sistema (ver ficha de integración).':'Lotes, campañas e ingredientes completos.')+
    (as.length?' <br>'+f(as.length)+' combinaciones lote-campaña no tienen actividad en el Plan de Uso: esos pastoreos se importan sin recurso y quedan en Alertas. Ej.: '+esc(as.slice(0,4).join('; '))+'.':'')+'</div>';
  h+='<div class="tools" style="margin-top:10px"><button class="btn pri" onclick="importarHist()"'+(falt.length?' disabled':'')+'>Importar histórico</button>'+(IMP.msg?'<span class="msg'+(IMP.err?' err':'')+'">'+esc(IMP.msg)+'</span>':'')+'</div></div>';
  return h;}
function importarHist(){if(!CAN_ADM||yaImportado()||!HIST)return;var d=diagImport();if(d.lotesSin.length||d.insSin.length){IMP.msg='Completá las equivalencias.';IMP.err=true;return render();}
  if(!esPuntal()){var cx={},cv=vals(S.categorias),fl=[],x1,x2;for(x1=0;x1<cv.length;x1++)cx[normN(cv[x1].nombre)]=1;
    for(x1=0;x1<HIST.p.length;x1++)for(x2=0;x2<HIST.p[x1][3].length;x2++){var cn=HIST.p[x1][3][x2][2];if(!cx[normN(cn)]){cx[normN(cn)]=1;fl.push(cn);}}
    if(fl.length){IMP.msg='El histórico usa categorías que no están en el sistema ('+fl.join(', ')+'). Las categorías son generales y solo las agrega Puntal.';IMP.err=true;return render();}}
  var cats={},cs=vals(S.categorias),i,j,k;for(i=0;i<cs.length;i++)cats[normN(cs[i].nombre)]=cs[i].id;
  var all=lsGet('gan_pastoreos',[]),nums={},n=0,sinRec=0,now=new Date().toISOString();
  var orden=HIST.p.slice().sort(function(a,b){var x=iniHist(a)||'',y=iniHist(b)||'';return x<y?-1:x>y?1:0;});
  for(i=0;i<orden.length;i++){var p=orden[i],lids=impLotes(p[0]),lid=lids[0],ini=iniHist(p),camp=ini?campDeFecha(ini):CAMP,L=S.lotes[lid];
    var acts=actsDe(lid,camp),tid=null;
    if(acts.length===1)tid=acts[0].tipoActividadId;
    else if(acts.length>1){for(j=0;j<acts.length;j++)if(rName(acts[j].tipoActividadId)===REC_EQ[p[1]])tid=acts[j].tipoActividadId;if(!tid)tid=recDe(lid,camp);}
    if(!tid)sinRec++;
    nums[lid]=(nums[lid]||0)+1;
    var movs=[],supl=[];
    for(j=0;j<p[3].length;j++){var m=p[3][j],cid=cats[normN(m[2])];
      if(!cid){cid=uid('cat');var nc={id:cid,nombre:m[2],orden:vals(S.categorias).length+1,activo:true};saveCat(nc);cats[normN(m[2])]=cid;}
      var mo={id:uid('m'),fecha:m[0],tipo:m[1],categoriaId:cid,cab:m[3],kg:m[4],obs:''};if(m[5])mo.cierra=true;movs.push(mo);}
    for(j=0;j<p[4].length;j++){var s=p[4][j];supl.push({id:uid('s'),fecha:s[0],insumoId:impIns(s[1]),kgTC:s[2],pctMS:s[3],obs:''});}
    all.push({id:uid('gp'),empresaId:EMP,campaniaId:camp,campoId:L?L.campoId:null,loteId:lid,loteIds:lids.length>1?lids:null,tipoActividadId:tid,num:nums[lid],movs:movs,supl:supl,origen:p[2],importado:true,creado:now});n++;}
  if(!lsSet('gan_pastoreos',all)){IMP.msg=LS_ERR;IMP.err=true;return render();}
  /* % MS de los ingredientes y entregas pendientes */
  for(k in HIST.ing){var iid=impIns(k);if(iid&&!S.insMs.hasOwnProperty(iid))saveInsMs(iid,HIST.ing[k]);}
  /* entregas cargadas en el Excel a nombres sin hoja: se asignan al pastoreo del lote equivalente que contiene la fecha */
  var pend=[],asig=0;
  for(i=0;i<HIST.pend.length;i++){var q2=HIST.pend[i],it={id:uid('s'),fecha:q2[0],insumoId:impIns(q2[1]),kgTC:q2[2],pctMS:q2[3],obs:''},dest=null,lp=PEND_EQ[q2[4]]?loteAuto(PEND_EQ[q2[4]]):'';
    if(lp){var bi=null;for(j=0;j<all.length;j++){var gg=all[j];if(gg.empresaId!==EMP||!inG(gg,lp))continue;var rg=rangoG(gg);if(rg[0]&&it.fecha>=rg[0]&&it.fecha<=rg[1]&&(!dest||rg[0]>bi)){dest=gg;bi=rg[0];}}}
    if(dest){it.obs='Excel: '+q2[4]+' #'+q2[5];dest.supl.push(it);asig++;}else{it.potreroTxt=q2[4];it.num=q2[5];pend.push(it);}}
  if(asig&&!lsSet('gan_pastoreos',all)){IMP.msg=LS_ERR;IMP.err=true;return render();}
  savePend(pend);cargarPropios();
  IMP.msg='Importados '+n+' pastoreos'+(sinRec?' ('+sinRec+' sin recurso: revisalos en Alertas)':'')+'. Entregas sin hoja en el Excel: '+asig+' asignadas a su lote y '+pend.length+' quedan para asignar en Suplementación.';IMP.err=false;render();}

document.addEventListener('keydown',function(e){if(e.key==='Escape'&&(editId||editNew))cancelar();});

iniciarApp();
</script>
